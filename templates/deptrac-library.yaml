# Canonical layers of the msstc4symfony standard, library variant (extra.bundle-standard.kind: "library").
# templates/deptrac.yaml without the bundle layers (DependencyInjection, BundleRoot): a library has no bundle class
# and no container extension. Copy as-is.
# A library may drop dependencies from the ruleset, never add them.
deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

    ruleset:
        Domain: ~
        DomainService:
            - Domain
        Application:
            - Domain
            - DomainService
        # Adapters implement Domain repositories and Application ports.
        Infrastructure:
            - Domain
            - Application
        Presentation:
            - Domain
            - Application
        Framework:
            - Domain
            - Application
