# Canonical layers of the msstc4symfony bundle standard (stage B spec, section 2).
# Copy as-is; replace the BundleRoot value with ^<bundle class>$ (deptrac reads an unanchored regex: anchors and
# doubled backslashes, e.g. ^Msstc4Symfony\\FooBundle\\FooBundle$).
# A bundle may drop dependencies from the ruleset, never add them.
deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*

        - name: BundleRoot
          collectors:
              - type: classLike
                value: '%BUNDLE_CLASS_PATTERN%'

    ruleset:
        Domain: ~
        DomainService:
            - Domain
        Application:
            - Domain
            - DomainService
        # Adapters implement Domain repositories and Application ports.
        Infrastructure:
            - Domain
            - Application
        Presentation:
            - Domain
            - Application
        Framework:
            - Domain
            - Application
        # Compiler passes reference decorator and adapter classes by ::class.
        DependencyInjection:
            - Domain
            - DomainService
            - Application
            - Infrastructure
            - Presentation
            - Framework
        # registerForAutoconfiguration() of Application interfaces.
        BundleRoot:
            - Application
            - DependencyInjection
